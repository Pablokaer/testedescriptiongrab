<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World MR Pipoca</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Hello, World MR Pipoca</h1>
      <p class="subtitle">A simple interactive playground</p>
    </header>

    <main class="dashboard">
      <section class="card counter-card" aria-labelledby="counter-title">
        <h2 id="counter-title" class="card-title">Click Counter</h2>
        <p class="counter-value" id="counter-value" aria-live="polite">0</p>
        <button type="button" id="counter-button" class="btn btn-primary">Click</button>
      </section>

      <section class="card" aria-labelledby="calculator-title">
        <h2 id="calculator-title" class="card-title">Calculator</h2>

        <div class="calculator-display" id="calculator-display" role="status">0</div>

        <div class="calculator-grid">
          <button type="button" class="btn btn-function" data-action="clear" aria-label="Clear">C</button>
          <button type="button" class="btn btn-function" data-action="backspace" aria-label="Backspace">⌫</button>
          <button type="button" class="btn btn-operator" data-action="operator" data-operator="/" aria-label="Divide">÷</button>
          <button type="button" class="btn btn-operator" data-action="operator" data-operator="*" aria-label="Multiply">×</button>

          <button type="button" class="btn btn-digit" data-action="digit" data-digit="7">7</button>
          <button type="button" class="btn btn-digit" data-action="digit" data-digit="8">8</button>
          <button type="button" class="btn btn-digit" data-action="digit" data-digit="9">9</button>
          <button type="button" class="btn btn-operator" data-action="operator" data-operator="-" aria-label="Subtract">−</button>

          <button type="button" class="btn btn-digit" data-action="digit" data-digit="4">4</button>
          <button type="button" class="btn btn-digit" data-action="digit" data-digit="5">5</button>
          <button type="button" class="btn btn-digit" data-action="digit" data-digit="6">6</button>
          <button type="button" class="btn btn-operator" data-action="operator" data-operator="+" aria-label="Add">+</button>

          <button type="button" class="btn btn-digit" data-action="digit" data-digit="1">1</button>
          <button type="button" class="btn btn-digit" data-action="digit" data-digit="2">2</button>
          <button type="button" class="btn btn-digit" data-action="digit" data-digit="3">3</button>
          <button type="button" class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>

          <button type="button" class="btn btn-function" data-action="negate" aria-label="Toggle sign">±</button>
          <button type="button" class="btn btn-digit" data-action="digit" data-digit="0">0</button>
          <button type="button" class="btn btn-digit" data-action="decimal" aria-label="Decimal point">.</button>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
